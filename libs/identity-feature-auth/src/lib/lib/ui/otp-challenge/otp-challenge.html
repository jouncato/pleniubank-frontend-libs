<h2>{{ title }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label for="code">Código OTP</label>
  <input
    #codeField
    id="code"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    formControlName="code"
  />

  <p class="error" *ngIf="errorMessage as error" aria-live="polite">{{ error }}</p>

  <button type="submit" [disabled]="form.invalid || submitting || resendEmailBusy">
    {{ submitting ? 'Verificando...' : 'Verificar' }}
  </button>
</form>

<div *ngIf="channel === 'email'" class="resend">
  <button type="button" (click)="resendEmailOtp()" [disabled]="resendEmailDisabled">
    {{
      resendEmailBusy
        ? 'Enviando...'
        : resendEmailSecondsLeft > 0
          ? 'Reenviar en ' + resendEmailSecondsLeft + ' s'
          : 'Reenviar código por correo'
    }}
  </button>
</div>

<a routerLink="/onboarding/party/customer/register">Volver al registro</a>
