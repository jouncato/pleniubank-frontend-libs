<div class="pl-container">
  <div class="pl-form-card otp-card">
    <h2 class="visually-hidden">{{ title }}</h2>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <p class="required-note"><span aria-hidden="true">*</span> Campo obligatorio</p>
      <div class="validation-summary" role="status" aria-live="polite" *ngIf="form.invalid">
        <strong>Completa o corrige estos campos:</strong>
        <span>{{ validationSummary.join(', ') }}</span>
      </div>
      <label for="code" class="otp-card__label">Código de verificación <span aria-hidden="true">*</span></label>
      <input
        #codeField
        id="code"
        class="otp-card__input"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        formControlName="code"
        aria-required="true"
        [attr.aria-invalid]="form.controls.code.invalid"
        aria-describedby="code-help code-error"
      />
      <span id="code-help" class="field-hint">Escribe los 6 dígitos que recibiste por {{ channel === 'phone' ? 'SMS' : 'correo' }}.</span>
      <p id="code-error" class="field-error" *ngIf="form.controls.code.touched && form.controls.code.invalid" role="alert">{{ codeErrorMessage() }}</p>

      <p class="error" *ngIf="errorMessage as error" role="alert" aria-live="polite">{{ error }}</p>

      <button
        type="submit"
        class="pl-btn pl-btn--primary pl-btn--block otp-card__submit"
        [disabled]="form.invalid || submitting || resendEmailBusy || resendPhoneBusy"
      >
        {{ submitting ? 'Verificando...' : 'Verificar' }}
      </button>
    </form>

    <div *ngIf="channel === 'email'" class="otp-card__resend">
      <button
        type="button"
        class="pl-btn pl-btn--outline pl-btn--block"
        (click)="resendEmailOtp()"
        [disabled]="resendEmailDisabled"
      >
        {{
          resendEmailBusy
            ? 'Enviando...'
            : resendEmailSecondsLeft > 0
              ? 'Reenviar en ' + resendEmailSecondsLeft + ' s'
              : 'Reenviar código por correo'
        }}
      </button>
    </div>

    <div *ngIf="channel === 'phone'" class="otp-card__resend">
      <button
        type="button"
        class="pl-btn pl-btn--outline pl-btn--block"
        (click)="resendPhoneOtp()"
        [disabled]="resendPhoneDisabled"
      >
        {{
          resendPhoneBusy
            ? 'Enviando...'
            : resendPhoneSecondsLeft > 0
              ? 'Reenviar en ' + resendPhoneSecondsLeft + ' s'
              : 'Reenviar código por SMS'
        }}
      </button>
    </div>

    <a routerLink="/onboarding/party/customer/verify-contact" class="otp-card__back">
      Cambiar método de verificación
    </a>
  </div>
</div>
