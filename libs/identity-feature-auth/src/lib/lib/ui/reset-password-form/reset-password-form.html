<h2>Restablecer contraseña</h2>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate *ngIf="vm.state !== 'success'">
  <label for="email">Correo electrónico</label>
  <input id="email" type="email" autocomplete="email" formControlName="email" />

  <input id="token" type="hidden" formControlName="token" />

  <label for="newPassword">Nueva contraseña</label>
  <input id="newPassword" type="password" autocomplete="new-password" formControlName="newPassword" />
  <ul aria-live="polite">
    <li [class.ok]="hasMinLength">Mínimo {{ minLength }} caracteres</li>
    <li [class.ok]="hasComplexity">Incluye mayúscula, minúscula, número y carácter especial</li>
    <li [class.ok]="passwordsMatch">Las contraseñas coinciden</li>
  </ul>

  <label for="confirmPassword">Confirmar contraseña</label>
  <input
    id="confirmPassword"
    type="password"
    autocomplete="new-password"
    formControlName="confirmPassword"
  />

  <p class="error" *ngIf="vm.errorMessage as error" role="alert" aria-live="polite">{{ error }}</p>
  <p
    class="error"
    *ngIf="form.controls.confirmPassword.hasError('mismatch')"
    role="alert"
    aria-live="polite"
  >
    Las contraseñas no coinciden.
  </p>

  <button type="submit" [disabled]="form.invalid || !hasMinLength || !hasComplexity || !passwordsMatch || vm.state === 'submitting'">
    {{ vm.state === 'submitting' ? 'Procesando...' : 'Actualizar contraseña' }}
  </button>
</form>

<section class="result" *ngIf="vm.state === 'success'">
  <p aria-live="polite">{{ vm.successMessage }}</p>
  <a routerLink="/onboarding/party/access/login">Ir a iniciar sesión</a>
</section>

<a routerLink="/onboarding/party/access/forgot-password">Volver a recuperación</a>
