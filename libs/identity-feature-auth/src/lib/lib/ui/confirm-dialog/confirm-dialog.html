<div class="overlay" role="presentation">
  <div class="backdrop" tabindex="-1" aria-hidden="true" (click)="onCancel()"></div>
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-heading"
    class="panel"
    (click)="$event.stopPropagation()"
  >
    <h2 id="confirm-dialog-heading" class="title">{{ dialogTitle() }}</h2>
    @if (message(); as msg) {
      <p class="message">{{ msg }}</p>
    }
    <div class="actions">
      <button type="button" class="btn-secondary" (click)="onCancel()">{{ cancelLabel() }}</button>
      <button type="button" class="btn-primary" (click)="onConfirm()" autofocus>{{ confirmLabel() }}</button>
    </div>
  </div>
</div>
