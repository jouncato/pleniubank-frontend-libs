<div class="fp-brand">
  <pb-logo variant="color" size="md" />
</div>

<div class="fp-icon" aria-hidden="true">
  <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 19 4M17 6l2 2M14 9l2 2"/></svg>
</div>

<p class="fp-eyebrow">Recuperación de cuenta</p>
<h2>Recuperar contraseña</h2>
<p class="fp-lead">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label for="email">Correo electrónico</label>
  <input id="email" type="email" autocomplete="email" formControlName="email" />

  <p class="error" *ngIf="vm.rateLimitMessage() as message" role="status" aria-live="polite">{{ message }}</p>
  <p class="error" *ngIf="vm.errorMessage() as error" role="alert" aria-live="polite">{{ error }}</p>

  <button type="submit" [disabled]="form.invalid || vm.state() === 'submitting' || vm.isRateLimited()">
    {{ vm.state() === 'submitting' ? 'Enviando...' : 'Continuar' }}
  </button>
</form>

<a [routerLink]="routes.login">Volver a iniciar sesión</a>
