<h2>Recuperar contrasena</h2>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate *ngIf="vm.state !== 'success'">
  <label for="email">Correo electronico</label>
  <input id="email" type="email" autocomplete="email" formControlName="email" />

  <label for="method">Metodo</label>
  <select id="method" formControlName="method">
    <option value="otp">Codigo OTP por correo</option>
    <option value="link">Enlace de recuperacion</option>
  </select>

  <p class="error" *ngIf="vm.rateLimitMessage as message" role="status" aria-live="polite">{{ message }}</p>
  <p class="error" *ngIf="vm.errorMessage as error" role="alert" aria-live="polite">{{ error }}</p>

  <button type="submit" [disabled]="form.invalid || vm.state === 'submitting' || vm.isRateLimited">
    {{ vm.state === 'submitting' ? 'Enviando...' : 'Continuar' }}
  </button>
</form>

<section class="result" *ngIf="vm.state === 'success'">
  <p aria-live="polite">
    {{ vm.successMessage }}
  </p>
  <p class="debug" *ngIf="vm.debugResetCode">
    Codigo de desarrollo: <code>{{ vm.debugResetCode }}</code>
  </p>
  <p class="debug" *ngIf="vm.debugResetToken">
    Token de desarrollo: <code>{{ vm.debugResetToken }}</code>
  </p>
  <a
    *ngIf="buildResetQueryParams() as query"
    [routerLink]="['/onboarding/party/access/reset-password']"
    [queryParams]="query"
  >
    Continuar a restablecer contrasena
  </a>
</section>

<a routerLink="/onboarding/party/access/login">Volver a iniciar sesion</a>
