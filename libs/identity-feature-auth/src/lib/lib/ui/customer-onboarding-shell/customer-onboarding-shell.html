<div class="pl-root customer-onb" [class.customer-onb--embedded]="embeddedHostShell">
  <div class="customer-onb__stepper-wrap pl-container">
    <p class="customer-onb__step-summary" aria-live="polite">
      <span>Paso {{ activeStep() }} de 3</span>
      <strong>{{ steps[activeStep() - 1].label }}</strong>
    </p>
    <nav class="customer-onb-stepper" aria-label="Progreso del registro">
      <ol class="customer-onb-stepper__list" role="list">
        @for (s of steps; track s.n) {
          <li
            class="customer-onb-stepper__item"
            [class.customer-onb-stepper__item--done]="isStepDone(s.n)"
            [attr.aria-current]="isStepCurrent(s.n) ? 'step' : null"
          >
            <span class="customer-onb-stepper__n">{{ s.n }}</span>
            <span class="customer-onb-stepper__label">{{ s.label }}</span>
          </li>
        }
      </ol>
      <div class="customer-onb-stepper__bar" aria-hidden="true">
        <div
          class="customer-onb-stepper__bar-fill"
          [style.width.%]="(activeStep() / 3) * 100"
        ></div>
      </div>
    </nav>
  </div>

  @if (!embeddedHostShell) {
    <section class="pl-section auth-page" [attr.aria-labelledby]="'onb-hero-title'">
      <div class="pl-container">
        <div class="auth-page__lede">
          <p class="pl-section__label">{{ hero().badge }}</p>
          <h1 id="onb-hero-title" class="auth-page__title">{{ hero().title }}</h1>
          <p class="auth-page__hint">{{ hero().sub }}</p>
        </div>
      </div>
    </section>
  }

  <section class="pl-section customer-onb__outlet-section">
    <router-outlet />
  </section>
</div>
