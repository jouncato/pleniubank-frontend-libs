<h2>Aceptar invitación</h2>

<p *ngIf="vm.missingToken()" class="error" role="alert">
  Enlace inválido. Verifica tu correo.
</p>

<form *ngIf="!vm.missingToken()" [formGroup]="form" (ngSubmit)="submit()">
  <input type="hidden" formControlName="token" />

  <label for="pw">Nueva contraseña (mín. 12)</label>
  <input id="pw" type="password" formControlName="password" autocomplete="new-password" />

  <p class="error" *ngIf="vm.errorMessage()" aria-live="polite">{{ vm.errorMessage() }}</p>

  <button type="submit" [disabled]="form.invalid || vm.state() === 'submitting'">
    {{ vm.state() === 'submitting' ? 'Procesando…' : 'Aceptar e ingresar' }}
  </button>
</form>
