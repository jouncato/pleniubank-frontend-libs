<h2>Aceptar invitación</h2>
<p class="required-note"><span aria-hidden="true">*</span> Campos obligatorios</p>

<p *ngIf="vm.missingToken()" class="error" role="alert">
  Enlace inválido. Verifica tu correo.
</p>

<form *ngIf="!vm.missingToken()" [formGroup]="form" (ngSubmit)="submit()">
  <div class="validation-summary" role="status" aria-live="polite" *ngIf="form.invalid">
    <strong>Completa o corrige estos campos:</strong>
    <span>{{ validationSummary.join(', ') }}</span>
  </div>
  <input type="hidden" formControlName="token" />

  <label for="pw">Nueva contraseña <span aria-hidden="true">*</span></label>
  <div style="position: relative;">
    <input
      id="pw"
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
      autocomplete="new-password"
      style="padding-right: 40px;"
      aria-required="true"
      [attr.aria-invalid]="form.controls.password.invalid"
      aria-describedby="pw-help pw-error"
    />
    <pb-password-visibility-toggle [(visible)]="showPassword" />
  </div>
  <p id="pw-help" class="hint">Mínimo 12 caracteres, una mayúscula, una minúscula, un número y un símbolo.</p>
  <p id="pw-error" class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid" role="alert">{{ passwordErrorMessage() }}</p>

  <p class="error" *ngIf="vm.errorMessage()" role="alert" aria-live="polite">{{ vm.errorMessage() }}</p>

  <button type="submit" [disabled]="form.invalid || vm.state() === 'submitting'">
    {{ vm.state() === 'submitting' ? 'Procesando…' : 'Aceptar e ingresar' }}
  </button>
</form>
