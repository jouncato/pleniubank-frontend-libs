<section class="verify-enterprise-email" aria-labelledby="verify-enterprise-title">
  <h2 id="verify-enterprise-title">Verificación del correo empresarial</h2>
  <p class="lede">
    Introduce el código que enviamos al correo del <strong>{{ roleLabel }}</strong>:
    <strong>{{ vm.maskedEmail() }}</strong>
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="otp">Código de verificación (OTP)</label>
    <input
      id="otp"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="12"
      formControlName="code"
    />

    <p class="error" *ngIf="vm.errorMessage()" aria-live="polite">{{ vm.errorMessage() }}</p>
    <p class="resend-info" *ngIf="vm.resendInfo()" aria-live="polite">{{ vm.resendInfo() }}</p>

    <button type="submit" [disabled]="form.invalid || vm.state() === 'submitting'">
      {{ vm.state() === 'submitting' ? 'Verificando…' : 'Verificar' }}
    </button>
  </form>

  <p class="resend-row">
    <button
      type="button"
      class="link-resend"
      [disabled]="vm.state() === 'expired' || vm.state() === 'submitting' || vm.resendSubmitting()"
      (click)="vm.resendCode()"
    >
      {{ vm.resendSubmitting() ? 'Enviando código…' : 'Reenviar código' }}
    </button>
  </p>

  <p class="footer-link">
    <a routerLink="/onboarding/party/organization/register">Volver al registro de empresa</a>
  </p>
</section>
